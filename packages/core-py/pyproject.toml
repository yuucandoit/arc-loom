[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-loom"
version = "0.1.0"
description = "Multi-Language CPU-ARC Orchestrator & Cost Telemetry Gateway"
readme = "../../README.md"
requires-python = ">=3.10"
authors = [
    { name = "ARC-Loom Contributors" }
]
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
]
postgres = [
    "psycopg[binary]>=3.1.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["arc_loom*"]
